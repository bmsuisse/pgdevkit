[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pgdevkit"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "pgdevkit/docs"
"skills" = "pgdevkit/skills"

[project]
name = "pgdevkit"
version = "0.19.0"
description = "A helper for developing with Postgres"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docker>=7.1.0",
    "psycopg[binary]>=3.3.0",
    "sqlglot>=30.11.0",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.19.0"]
cli = [
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "typer>=0.26.7",
]
db = [
    "psycopg-pool>=3.3.0",
    "pydantic>=2.0",
]
# >= 0.118: a Depends with `yield` only releases its connection after the streaming response has been sent
fastapi = ["pgdevkit[db]", "fastapi>=0.118.0"]
mssql = ["mssql-python>=1.0.0"]

[project.scripts]
pgdb = "pgdevkit.cli:app"

[tool.pgdevkit]
name = "pgdevkit"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
test = [
    "fastapi>=0.118.0",
    "granian>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.0",
    "psycopg-pool>=3.3.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=0.24.0",
    "pytest-env>=1.1.0",
]

[tool.uv]
# Dependency cooldown: releases younger than 5 days are not resolved
exclude-newer = "5 days"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["mssql: requires a live MSSQL testdb container and the mssql extra (msodbcsql driver)"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"
extend-exclude = ["*.md", ".worktrees", ".claude"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", "F", "I",   # pycodestyle, pyflakes, isort
    "UP",            # pyupgrade - X | None, modern syntax
    "B",             # bugbear - mutable defaults etc.
    "ANN",           # full type annotations
    "SIM", "C4",     # simplifiable code, needless comprehensions/casts
    "PERF", "FURB",  # needless loops, manual list/dict building
    "ASYNC",         # blocking calls inside async def
    "RUF",
    "N",             # PEP 8 naming
    "PTH",           # pathlib instead of os.path
    "TID",           # absolute imports only, banned APIs
    "RET", "PIE",    # consistent returns, misc simplifications
    "A",             # no shadowing builtins
    "T20",           # no print()
    "LOG",           # logging API misuse
    "DTZ",           # timezone-aware datetimes
    "FLY",           # f-string instead of str.join on literals
    "PLE", "PLW",    # pylint errors + warnings
]
ignore = [
    "ANN401",  # `Any` is a warning via the ruff-warn-any prek hook, not an error
    # DiffKind(str, Enum) is public API: StrEnum would change str()/format() of its members (follow-up issue)
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# `all=` is a published keyword of clean_testdb() (mirrored by the mssql backend); renaming it would break callers
"pgdevkit/testdb/api.py" = ["A002"]
"pgdevkit/testdb/mssql/api.py" = ["A002"]
# TrackingTableMissing is a published exception class; renaming it would break `except` clauses of callers
"pgdevkit/migrate.py" = ["N818"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = [".worktrees", ".claude"]
